kind     = "electron"
class    = "normal"
paths    = ["%APPDATA%/CherryStudio"]
updater  = ["cherrystudio-updater"]
processes = ["CherryStudio.exe"]

[[agent]]
id       = "utools"
name     = "uTools"
kind     = "electron"
class    = "normal"
paths    = ["%APPDATA%/uTools"]
updater  = ["utools-updater"]
processes = ["uTools.exe"]


# ───────────────────────────── 缓存类（class="safe"）示例 ─────────────────────────────
#  这类目录搬走没有风险（丢了也只是重新下载），适合放最前面给用户先练手。

[[agent]]
id       = "npm-cache"
name     = "npm 缓存"
kind     = "generic"
class    = "safe"
paths    = ["%LOCALAPPDATA%/npm-cache", "~/.npm/_cacache"]
processes = []
note     = "纯缓存。搬走后 npm 会按需重新拉取。"



name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- 内核 + CLI
  #
  # 🔴 刻意跑在 Linux 上，而不是 Windows。
  # 这个项目里大量代码是 Windows 专属的（robocopy、`mklink`、Restart Manager、
  # `GetDiskFreeSpaceExW`…）。**只在 Windows 上跑 CI 是抓不到问题的** ——
  # 只被某个平台用到的私有 helper 在另一个平台上就是「死代码」，
  # 而 `-D warnings` 会把它变成构建失败。mac/linux 全绿、win 挂，或反过来，
  # 都很常见。跑 Linux 这一趟就是为了提早撞上这类问题。
  #
  # ⚠️ `actions-rust-lang/setup-rust-toolchain` 的 `rustflags` **默认就是
  #    `-D warnings`**。这里不改它 —— 就是要让警告直接失败。
  core:
    name: 内核与 CLI（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
          # ⚠️ 显式写出来，不依赖 action 的默认值 ——
          # 这个默认值一旦被上游改掉，我们就悄悄失去「警告即失败」的保护。
          rustflags: "-D warnings"

      - name: 版本/格式自检
        run: cargo fmt --all --check

      # 🔴 防回归：所有外部命令必须走 `acm_core::syscmd::command`。
      #
      # 为什么值得一条 CI 检查：Windows GUI 进程（`windows_subsystem = "windows"`）
      # 调用控制台程序时，会**为每个子进程新建一个控制台窗口** —— 用户看到一串黑框。
      # 修法是创建时带 `CREATE_NO_WINDOW`，但这是「每个调用点都得记得」的约定，
      # 而本项目已经踩过一次：`robocopy` 加了、`tasklist` 漏了，
      # 结果启动一次弹十几个窗口（检测 13 个 Agent × 两阶段）。
      #
      # 约定靠人记必然再漏，所以这里用一条 grep 变成硬约束。
      # 模式带 `(` 是为了不误伤注释里提到的 `Command::new`（那是反引号包裹、无括号）。
      - name: 子进程入口检查
        run: |
          bad=$(grep -rn --include='*.rs' 'Command::new(' crates/ src-tauri/src/ \
                  | grep -v 'crates/acm-core/src/syscmd.rs' || true)
          if [ -n "$bad" ]; then
            echo "::error::外部命令必须走 acm_core::syscmd::command —— 直接 Command::new 会让 Windows GUI 每次调用都弹一个控制台窗口"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done <<< "$bad"
            exit 1
          fi
          echo "✓ 所有子进程调用都经过 syscmd::command"

      - name: 跑单测
        run: |
          # 🔴 失败时把摘要显式打成 annotation。
          # 原因：GitHub 的 **job 日志下载要额外权限**（实测 API 会 401/403），
          # 而 annotation 是能可靠读到的。不加这段的话，失败信息只有一个
          # "Process completed with exit code 101" —— 等于没有。
          set -o pipefail
          if cargo test -p acm-core -p acm-cli --all-targets 2>&1 | tee /tmp/test.log; then
            echo "✓ 测试全部通过"
          else
            {
              # ⚠️ 每个可能"无输出"的命令都要 `|| true`：bash 带 `-e`、上面又开了
              # `pipefail` —— grep 没匹配到会返回 1，导致整个脚本**提前退出**、
              # 一条诊断都发不出来。踩过。
              grep -nE "FAILED|panicked|assertion|^error|left ==|right ==|test result:" /tmp/test.log | head -12 || true
              echo "=== 日志末尾 ==="
              tail -20 /tmp/test.log || true
            } | while IFS= read -r line || [ -n "$line" ]; do
              line="${line//$'\r'/}"
              line="${line//%/%25}"
              if [ -n "$line" ]; then echo "::error::$line"; fi
            done
            exit 1
          fi

  # ---------------------------------------------------------------- 前端
  frontend:
    name: 前端（类型 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: npm run build

      - name: 演示模式也要能构建
        run: VITE_DEMO_MODE=1 npx vite build

# 注：`src-tauri`（桌面壳）故意没进 CI —— 它在 Linux 上要装
# webkit2gtk / libsoup / librsvg 一堆系统包，成本高、收益低。
# 桌面包裹到 release 时由本地或专门的打包 workflow 处理。
